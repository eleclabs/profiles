<!DOCTYPE html>
<html>
<head>
    <title>Test Registration Fix</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { background: #f8f9fa; padding: 20px; border-radius: 5px; margin: 10px 0; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🔧 ทดสอบการแก้ไขปัญหาการสมัครสมาชิก</h1>
    
    <button onclick="testRegistration()">ทดสอบการสมัครสมาชิก</button>
    <button onclick="testLogin()">ทดสอบการเข้าสู่ระบบ</button>
    
    <div id="result" class="test-result"></div>

    <script>
        async function testRegistration() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<h3>กำลังทดสอบ...</h3>';
            
            try {
                const testData = {
                    email: `test${Date.now()}@example.com`,
                    password: 'test123456'
                };
                
                console.log('Testing registration with:', testData);
                
                const response = await fetch('http://localhost:8000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testData)
                });

                const responseText = await response.text();
                console.log('Registration response:', response.status, responseText);
                
                if (response.ok) {
                    const data = JSON.parse(responseText);
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ สมัครสมาชิกสำเร็จ!</h3>
                            <p><strong>Email:</strong> ${data.email}</p>
                            <p><strong>User ID:</strong> ${data._id}</p>
                            <p><strong>Token:</strong> ${data.token.substring(0, 50)}...</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ สมัครสมาชิกล้มเหลว</h3>
                            <p><strong>Status:</strong> ${response.status}</p>
                            <p><strong>Response:</strong></p>
                            <pre>${responseText}</pre>
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('Registration test error:', error);
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ เกิดข้อผิดพลาด</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }

        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<h3>กำลังทดสอบการเข้าสู่ระบบ...</h3>';
            
            try {
                const response = await fetch('http://localhost:8000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 's@s.com',
                        password: 's12345'
                    })
                });

                const responseText = await response.text();
                console.log('Login response:', response.status, responseText);
                
                if (response.ok) {
                    const data = JSON.parse(responseText);
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ เข้าสู่ระบบสำเร็จ!</h3>
                            <p><strong>Email:</strong> ${data.email}</p>
                            <p><strong>Role:</strong> ${data.role}</p>
                            <p><strong>Status:</strong> ${data.approvalStatus}</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ เข้าสู่ระบบล้มเหลว</h3>
                            <p><strong>Status:</strong> ${response.status}</p>
                            <p><strong>Response:</strong></p>
                            <pre>${responseText}</pre>
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('Login test error:', error);
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ เกิดข้อผิดพลาด</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
